# This workflow will build a package using Maven and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path

name: Maven Package

on:
  push:
    branches:
      - dev-wresni

jobs:
  build:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checking out
        uses: actions/checkout@v4

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.WORKFLOW_TOKEN }}

      - name: Debug before build
        run: |
          pwd
          ls -l

      - name: Build and push Docker image
        run: |
          docker build -t $DOCKER_IMAGE:$DOCKER_TAG -f Dockerfile-maven .
          docker push $DOCKER_IMAGE:$DOCKER_TAG

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASS }}
          script: |
            set +o history
            echo ${{ secrets.WORKFLOW_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            set -o history
            echo "Image: $DOCKER_IMAGE"
            echo "Tag: $DOCKER_TAG"
            echo "Image Tag: DOCKER_IMAGE:$DOCKER_TAG"
            docker pull $DOCKER_IMAGE:$DOCKER_TAG
            docker stop spring-admin-dev || true
            docker rm spring-admin-dev || true
            docker run -d  --name spring-admin-dev --network spring-app -p 9090:9090 $DOCKER_IMAGE:$DOCKER_TAG

    env:
      DOCKER_IMAGE: ghcr.io/${{ github.actor }}/spring-admin
      DOCKER_TAG: dev
